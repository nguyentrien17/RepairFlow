name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: repairflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      ENABLE_DEV_TOOLS: 'true'
      PORT: '3001'
      APP_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root_password
      DB_NAME: repairflow_test
      JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_2026
      DEVICE_SECRET_KEY: ci_test_device_encryption_key_32_chars_2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (lint)
        run: npm run lint

      - name: Run unit & MySQL integration tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Build backend bundle
        run: npm run build:server

